name: Validate game (no deployment)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: python3 scripts/package-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: republic-of-chickens-v1.0-local-build
          path: release/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: playwright-report/
